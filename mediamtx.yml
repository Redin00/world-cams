# ==========================================
# MediaMTX Configuration for WorldCams
# RTSP-to-WebRTC / HLS Streaming Gateway
# ==========================================

logLevel: info
logDestinations: [stdout]
readTimeout: 25s
writeTimeout: 25s

# ------------------------------------------
# Control API (Used by FastAPI backend)
# ------------------------------------------
api: true
apiAddress: :9997

# ------------------------------------------
# RTSP Server
# ------------------------------------------
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

# ------------------------------------------
# HLS (HTTP Live Streaming)
# Standard fMP4 HLS eliminates LL-HLS blocking reload 404s behind Nginx/Cloudflare/Tor
# while preserving H.264/H.265/AAC/Opus support and a generous jitter buffer.
# ------------------------------------------
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: fmp4
hlsSegmentCount: 10
hlsSegmentDuration: 1s

# ------------------------------------------
# WebRTC (Ultra Low Latency WHEP)
# ------------------------------------------
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2: []

# ------------------------------------------
# Stream Paths & Sources
# ------------------------------------------
paths:
  all_others: {}
