# ==========================================
# MediaMTX Configuration for WorldCams
# RTSP-to-WebRTC / HLS Streaming Gateway
# ==========================================

logLevel: info
logDestinations: [stdout]

# ------------------------------------------
# Control API (Used by FastAPI backend)
# ------------------------------------------
api: true
apiAddress: :9997

# ------------------------------------------
# RTSP Server
# ------------------------------------------
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

# ------------------------------------------
# HLS (HTTP Live Streaming)
# ------------------------------------------
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# ------------------------------------------
# WebRTC (Ultra Low Latency WHEP)
# ------------------------------------------
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# ------------------------------------------
# Stream Paths & Sources
# ------------------------------------------
paths:
  all_others: {}
